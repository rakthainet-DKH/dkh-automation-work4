name: Build & Test

on:
  push:
    branches: [ main, DKH ]
  pull_request:
    branches: [ main, DKH ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build Java Services
      run: |
        cd java-services
        mvn clean package -DskipTests
    
    - name: Build Go Services
      run: |
        cd go-services
        go build -v ./...
    
    - name: Run Tests
      run: |
        cd java-services
        mvn test
